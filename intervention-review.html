<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intervention screening review</title><link rel="stylesheet" href="design/expert-portal/tokens.css"><style>
body{margin:0;background:var(--page);color:var(--navy);font:14px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:32px}a{color:inherit}h1{font-size:24px}button,input,select{font:inherit;padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--navy)}nav{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.summary{color:var(--muted)}article{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin:16px 0}h2{font-size:17px;margin:6px 0 12px}.pill{display:inline-block;background:var(--surface-muted);padding:5px 8px;border-radius:6px;margin:3px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em}details{margin:8px 0}summary{cursor:pointer}blockquote{margin:10px 0;padding-left:12px;border-left:2px solid var(--tan);line-height:1.5}small{color:var(--muted);overflow-wrap:anywhere}.review{border-left:3px solid var(--coral);padding-left:10px}#counts{display:flex;flex-wrap:wrap;gap:6px} .finding{border-bottom:1px solid var(--border);padding:8px 0}
</style></head><body><main><a href="/">← Dashboard</a><h1>Intervention screening · full review</h1><p class="summary">All ongoing interventional studies in the current scope. Excluded studies are omitted. AI-generated labels for inspection; original trial records are unchanged.</p><nav><select id="group" aria-label="Study group"><option value="treatment">Treatment modality</option><option value="other">Other interventions</option></select><select id="category" aria-label="Grouped category"><option value="">All grouped categories</option></select><input id="search" placeholder="Search title, ID or label" aria-label="Search results"><label><input type="checkbox" id="flagged"> Needs review only</label><button id="reload">Refresh results</button></nav><p id="status" role="status"></p><div id="counts"></div><div id="results"></div></main><script src="intervention-review.js"></script></body></html>
